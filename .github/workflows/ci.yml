name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: make lint
      # The test suite is hermetic: tests/fakebin stubs apt, pkg, dpkg,
      # dpkg-query, apt-cache, apt-mark, gum, fzf, curl, figlet, git and
      # python3, each test gets its own HOME/PREFIX under tests/tmp, and the
      # fzf paths are driven by the fake fzf answering FZF_QUEUE. So the same
      # 189 scenario tests that pass in Termux also pass on a plain runner.
      - name: Test
        run: make test
